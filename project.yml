# XcodeGen project spec — generates RollCam.xcodeproj
# Run `xcodegen generate` (after `brew install xcodegen`) before opening in Xcode.
# CI does this automatically; on Windows you never touch the .xcodeproj.

name: RollCam

options:
  bundleIdPrefix: com.rejkavaz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Allow CI builds without a paid Apple Developer account.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

targets:
  RollCam:
    type: application
    platform: iOS
    sources:
      - path: RollCam
    info:
      # Hand-rolled Info.plist so we can express the nested scene manifest
      # and the device-capability / orientation arrays that flat
      # INFOPLIST_KEY_* build settings can't represent.
      path: RollCam/Generated-Info.plist
      properties:
        CFBundleDisplayName: MatPulse
        # CoreBluetooth: connect to a BLE chest strap (Polar H10, Wahoo, etc.)
        NSBluetoothAlwaysUsageDescription: "MatPulse connects to your heart-rate chest strap over Bluetooth to record live HR while you roll. Used only while the app is open."
        # AVFoundation: record the roll
        NSCameraUsageDescription: "MatPulse uses the camera to film your roll with a live heart-rate overlay. Video stays on your device until you choose to share it."
        NSMicrophoneUsageDescription: "MatPulse records audio with your roll and lets you pin a short voice note to a session. Stored only on your device."
        NSPhotoLibraryAddUsageDescription: "Lets you save an exported highlight clip to your photo library."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rejkavaz.RollCam
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (portrait instrument UI)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  RollCam:
    build:
      targets:
        RollCam: all
    run:
      config: Debug
    archive:
      config: Release
