<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RollCam — Prototype</title>
  <link rel="stylesheet" href="proto/theme.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0d11; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 28px;
      background:
        radial-gradient(60% 60% at 50% 0%, #14181f 0%, #0b0d11 60%),
        #0b0d11;
      font-family: 'Sora', system-ui, sans-serif;
    }
    #stage { display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="stage"><div id="root"></div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="proto/ios-frame.jsx"></script>
  <script type="text/babel" src="proto/icons.jsx"></script>
  <script type="text/babel" src="proto/data.jsx"></script>
  <script type="text/babel" src="proto/ui.jsx"></script>
  <script type="text/babel" src="proto/screens_capture.jsx"></script>
  <script type="text/babel" src="proto/screens_progress.jsx"></script>
  <script type="text/babel" src="proto/screens_review.jsx"></script>
  <script type="text/babel" src="proto/screens_share.jsx"></script>
  <script type="text/babel" src="proto/app.jsx"></script>

  <script type="text/babel" data-presets="react">
    function Mount() {
      return (
        <IOSDevice dark>
          <RollCamApp />
        </IOSDevice>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Mount />);

    function fitStage() {
      const stage = document.getElementById('stage');
      const s = Math.min(1, (window.innerHeight - 48) / 874, (window.innerWidth - 48) / 402);
      stage.style.transform = 'scale(' + s + ')';
      stage.style.transformOrigin = 'center center';
    }
    window.addEventListener('resize', fitStage);
    fitStage();
  </script>
</body>
</html>
